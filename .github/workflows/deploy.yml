name: Deploy Wwork API

on:
  push:
    branches:
      - main # O deploy acontece sempre que você enviar código para a branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.PORT }}
          script: |
            # 1. Entra na pasta do subdomínio da API
            cd /home/${{ secrets.USERNAME }}/api.wwork.upbase.com.br
            
            # 2. Coloca o Laravel em modo de manutenção
            php artisan down || true
            
            # 3. Puxa as alterações do repositório no GitHub
            git pull origin main
            
            # 4. Instala/atualiza dependências do PHP para produção
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            
            # 5. Executa as migrations do banco de dados
            php artisan migrate --force
            
            # 6. Limpa e recria os caches do Laravel
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            
            # 7. Tira o Laravel do modo de manutenção
            php artisan up