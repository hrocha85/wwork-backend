name: Deploy Wwork API

on:
  push:
    branches:
      - main # O deploy acontece sempre que você enviar código para a branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.PORT }}
          script: |
            # 1. Entra na pasta exata do subdomínio dentro da public_html
            cd /home/${{ secrets.USERNAME }}/public_html/api.wwork.upbase.com.br

            # php83 é o PHP 8.3 do seletor do site (~/.local/bin/php83).
            # O SSH do Actions não carrega esse PATH sozinho.
            export PATH="$HOME/.local/bin:$PATH"
            
            # 2. Descarta alterações locais no servidor
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Coloca o Laravel em modo de manutenção
            php83 artisan down || true
            
            # 4. Limpa instalação anterior incompleta do Composer
            rm -rf vendor composer-setup.php
            
            # 5. Garante que o composer.phar existe no projeto
            if [ ! -f composer.phar ]; then
              curl -sS https://getcomposer.org/installer -o composer-setup.php
              php83 -d allow_url_fopen=On composer-setup.php
              rm -f composer-setup.php
            fi
            
            # 6. Instala dependências com o mesmo PHP 8.3 do site
            php83 -d allow_url_fopen=On composer.phar install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            
            # 7. Executa as migrations do banco de dados
            php83 artisan migrate --force
            
            # 8. Limpa e recria os caches do Laravel
            php83 artisan optimize:clear
            php83 artisan config:cache
            php83 artisan route:cache
            
            # 9. Tira o Laravel do modo de manutenção
            php83 artisan up